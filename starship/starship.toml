# ~/.config/starship.toml

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
$directory$git_branch$git_status$rust
[⟡ ](grey)$character"""

[directory]
truncation_length = 1
truncate_to_repo = false
style = "blue bold"
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "purple bold"
format = "[$symbol$branch]($style) "

[git_status]
style = "red bold"
format = '[\[$all_status$ahead_behind\]]($style) '
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?'
stashed = '$'
modified = '+'
staged = '+'
renamed = '»'
deleted = ''

[character]
success_symbol = "[⬩➤](green)"
error_symbol = "[✗](red)"

[rust]
symbol = '🦀 '
format = '[via ](white)[$symbol$version]($style)'
style = 'red bold'
